<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120E0B">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co https://*.goatcounter.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>Glowmelan · Skincare for melanin-rich skin</title>
<meta name="description" content="A free skin quiz and daily routine built for brown and Black skin. Fade dark spots, even your tone, and track your progress.">
<meta property="og:type" content="website">
<meta property="og:title" content="Glowmelan · Skincare for melanin-rich skin">
<meta property="og:description" content="Take a 1-minute skin quiz and get a routine built for dark spots, uneven tone and melasma.">
<meta property="og:url" content="https://glowmelan.adrizza.com/">
<meta property="og:image" content="https://glowmelan.adrizza.com/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:swap;src:url(instrument-serif.woff2) format('woff2')}
@font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;font-display:swap;src:url(instrument-serif-italic.woff2) format('woff2')}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:300 700;font-display:swap;src:url(space-grotesk.woff2) format('woff2')}
:root{--bg:#120E0B;--card:#1E1712;--line:#33271F;--text:#F4EBE1;--muted:#B9A797;--soft:#CDBDAE;--gold:#F2B33D;--ink:#1A1208}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100%}
button{font-family:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
.serif{font-family:'Instrument Serif',serif;font-weight:400}
.logo{font-family:'Instrument Serif',serif;font-style:italic;font-size:26px}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:44px;line-height:1;letter-spacing:-1px}
h1 em{color:var(--gold)}
h1:focus,h2:focus{outline:none}
a{color:var(--gold)}a:hover{color:#FFD07A}
h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:32px;line-height:1.05}
.lead{font-size:16px;line-height:1.5;color:var(--soft)}
.small{font-size:13px;color:var(--muted);line-height:1.45}
.label{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.btn{min-height:56px;border:0;border-radius:99px;background:var(--gold);color:var(--ink);font-weight:700;font-size:17px;cursor:pointer;width:100%;transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.link{background:none;border:0;color:var(--gold);font-size:15px;cursor:pointer;padding:12px;min-height:44px}
.bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.progress{display:flex;gap:6px}
.progress i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.progress i.on{background:var(--gold)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.back{width:44px;height:44px;border-radius:99px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer}
/* tones */
.tones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tone{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px;min-height:44px}
.tone span.sw{width:100%;aspect-ratio:1;border-radius:99px;display:block;transition:outline-color .15s}
.tone[aria-pressed="true"] span.sw{outline:3px solid var(--gold);outline-offset:3px}
.tone span.t{font-size:12px;color:var(--muted)}
/* options */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px 18px;font-size:16px;cursor:pointer;display:flex;align-items:center;gap:14px;min-height:60px}
.opt .dot{width:22px;height:22px;border-radius:99px;border:2px solid #5A4A3E;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.opt[aria-pressed="true"]{border-color:var(--gold);background:#251B11}
.opt[aria-pressed="true"] .dot{border-color:var(--gold);background:var(--gold)}
.opt .sub{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#2A2017;border:1px solid #4E3C1D;color:#F2C97A;border-radius:99px;padding:7px 12px;font-size:13px}
.note{display:flex;gap:12px;background:#241B12;border:1px solid #4E3C1D;border-radius:20px;padding:14px 16px;font-size:14px;line-height:1.45;color:#E8D7C4}
.input{width:100%;min-height:52px;background:#0E0B08;border:1.5px solid var(--line);border-radius:16px;color:var(--text);font:500 16px 'Space Grotesk',sans-serif;padding:0 16px;outline:none}
.input:focus{border-color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:#0E0B08;border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.tile .v{font-family:'Instrument Serif',serif;font-size:26px;line-height:1.1}
.tip{display:flex;gap:10px;font-size:14px;line-height:1.45;color:var(--soft)}
.tip i{width:8px;height:8px;border-radius:99px;background:var(--gold);flex-shrink:0;margin-top:7px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#0E0B08;border-top:1px solid #241B15;padding:6px 10px calc(8px + env(safe-area-inset-bottom))}
.nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;color:#A89585;font-size:12px;cursor:pointer}
.nav button[aria-current="page"]{color:var(--gold);font-weight:600}
.app.has-nav{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cmp figure{margin:0;display:flex;flex-direction:column;gap:6px}
.cmp img,.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:16px;background:#0E0B08;display:block}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thumb{position:relative}
.thumb .del{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:99px;border:0;background:rgba(14,11,8,.8);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.filebtn{display:flex;align-items:center;justify-content:center;gap:10px}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.fade{animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body>
<main class="app" id="app"></main>

<script src="app.js"></script>
</body>
</html>
